# Pre-commit hooks configuration
# Uses locally installed tools (no isolated environments)
# Run: pre-commit install (first time setup)
# Run: pre-commit run --all-files (manual check)

repos:
  - repo: local
    hooks:
      # Ruff linting (check-only)
      - id: ruff
        name: ruff
        entry: ruff check --no-fix
        language: system
        types: [python]
        verbose: true

      # Ruff formatting (check-only)
      - id: ruff-format
        name: ruff-format
        entry: ruff format --check
        language: system
        types: [python]
        verbose: true

      # JSON validation
      - id: jsonlint
        name: jsonlint
        entry: uvx --from demjson3 jsonlint -S
        language: system
        types: [json]
        exclude: ^\.vscode/
        verbose: true

      # YAML validation
      - id: yamllint
        name: yamllint
        entry: >-
          uvx yamllint -d "{extends: default, rules: {line-length: {max: 120},
          document-start: disable, truthy: {check-keys: false},
          comments: {min-spaces-from-content: 1}}}"
        language: system
        types: [yaml]
        verbose: true

      # Markdown linting
      - id: pymarkdown
        name: pymarkdown
        entry: pymarkdown --config .pymarkdownlint.json scan
        language: system
        types: [markdown]
        verbose: true

      # Type checking (devcontainer only — requires HA deps installed)
      #
      # The Python package starts with a digit (e.g. `4noks_elios4you`),
      # so `ty` cannot import it directly. The canonical workaround is the
      # `fournoks_elios4you` symlink. Devcontainer postCreate creates
      # it persistently and .gitignore hides it from `git status`. This
      # hook ensures the symlink exists at invocation time (so it works
      # outside the devcontainer where postCreate didn't fire) and cleans
      # up only the symlink it created itself — leaving any pre-existing
      # persistent symlink untouched.
      #
      # `--python "$(which python)"` resolves the interpreter at runtime
      # so the hook works whether Python lives at the venv path
      # (/home/vscode/.local/ha-venv/bin/python in the HA-style
      # devcontainer) or elsewhere — matches the dynamic resolution the
      # CI lint workflow already uses.
      - id: ty
        name: ty
        entry: >-
          bash -c '
          if [ ! -L "custom_components/fournoks_elios4you" ]; then
          ln -s 4noks_elios4you "custom_components/fournoks_elios4you";
          created_symlink=1;
          fi;
          ty check --python "$(which python)" "custom_components/fournoks_elios4you";
          status=$?;
          if [ -n "$created_symlink" ]; then
          rm -f "custom_components/fournoks_elios4you";
          fi;
          exit $status'
        language: system
        pass_filenames: false
        types: [python]
        verbose: true
